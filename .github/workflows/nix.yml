name: Nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .config/home-manager/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .config/home-manager/**
      - .github/workflows/nix.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-manager:
    # The flake targets aarch64-darwin.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The package diff builds the PR's base commit.
          fetch-depth: 0

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Flake check
        run: nix flake check

      - name: Build Home Manager configuration
        run: nix build --print-build-logs .#homeConfigurations.vluther.activationPackage

      - name: Package changes
        if: github.event_name == 'pull_request'
        # A base commit that no longer builds shouldn't fail the PR.
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          nix build --out-link result-base \
            "git+file://$GITHUB_WORKSPACE?rev=$BASE_SHA#homeConfigurations.vluther.activationPackage"
          changes=$(nix store diff-closures ./result-base ./result | sed 's/\x1b\[[0-9;]*m//g')
          {
            echo "## Package changes"
            echo
            if [ -z "$changes" ]; then
              echo "No package changes."
            else
              echo '```'
              echo "$changes"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$changes"
